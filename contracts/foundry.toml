[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
polygon = "https://polygon-bor-rpc.publicnode.com"
amoy = "https://rpc-amoy.polygon.technology"

[invariant]
runs = 40
depth = 20
fail_on_revert = false

[fmt]
line_length = 120
number_underscore = "thousands"
