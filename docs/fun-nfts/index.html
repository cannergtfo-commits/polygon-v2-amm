<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fun POL pictures</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Georgia, serif; background: #16141a; color: #f3ead8; }
    main { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { font-weight: 500; font-size: 42px; margin-bottom: 8px; }
    p { color: #cbbfaa; line-height: 1.45; max-width: 640px; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
    a.card { color: inherit; text-decoration: none; background: #221e27; border-radius: 18px; overflow: hidden; }
    img { width: 100%; display: block; }
    .card div { padding: 12px 14px 16px; }
    small { letter-spacing: .08em; text-transform: uppercase; color: #a89880; }
    @media (max-width: 800px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Fun POL pictures</h1>
    <p>Three sets of one hundred drawings. They are pictures. They are listed at 5 POL. They are not a claim on anything else.</p>
    <div class="row" id="row"></div>
  </main>
  <script>
    const sets = [
      ["sleepy", "Sleepy Validators"],
      ["stubs", "Night Market Stubs"],
      ["moths", "Crystal Moths"]
    ];
    const row = document.getElementById("row");
    for (const [dir, name] of sets) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = dir + "/1.json";
      a.innerHTML = '<img src="' + dir + '/1.png" alt="" /><div><small>100 pictures</small><h2>' + name + '</h2></div>';
      row.appendChild(a);
    }
  </script>
</body>
</html>
